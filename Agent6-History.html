<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 03 · Tracker — Job Search OS</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f3ee; --bg2: #eceae3; --bg3: #fff;
  --border: rgba(0,0,0,0.08); --border-s: rgba(0,0,0,0.15);
  --text: #1a1916; --mid: #5a5850; --dim: #9a9890;
  --accent: #534ab7;
  --go: #0f6e56; --go-bg: #e1f5ee; --go-border: rgba(15,110,86,.2);
  --warn: #854f0b; --warn-bg: #faeeda;
  --no: #a32d2d; --no-bg: #fcebeb;
}
html, body { min-height:100%; background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; }

/* NAV */
.os-nav { display:flex; align-items:center; padding:0 32px; border-bottom:1px solid var(--border); background:var(--bg); height:48px; position:sticky; top:0; z-index:100; }
.nav-logo { font-family:'Instrument Serif',serif; font-size:17px; color:var(--text); text-decoration:none; margin-right:32px; flex-shrink:0; }
.nav-logo em { font-style:italic; color:var(--accent); }
.nav-links { display:flex; gap:2px; flex:1; }
.nav-link { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); text-decoration:none; padding:0 14px; height:48px; display:flex; align-items:center; border-bottom:2px solid transparent; transition:color .15s,border-color .15s; white-space:nowrap; }
.nav-link:hover { color:var(--mid); }
.nav-link.active { color:var(--accent); border-bottom-color:var(--accent); }
.nav-context { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); letter-spacing:.06em; padding:4px 10px; background:var(--bg2); border-radius:6px; display:none; }
.nav-context.show { display:block; }

/* HEADER */
.header { padding:28px 32px 24px; border-bottom:1px solid var(--border); }
.tag { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:5px; }
.title { font-family:'Instrument Serif',serif; font-size:32px; line-height:1; letter-spacing:-.01em; }
.title em { font-style:italic; color:var(--accent); }
.sub { font-size:13px; color:var(--mid); margin-top:4px; font-weight:300; }

/* MAIN */
.main { padding:24px 32px; max-width:920px; }

/* ANALYTICS BAR */
.analytics-bar { display:flex; align-items:stretch; background:var(--bg3); border:1px solid var(--border); border-radius:10px; margin-bottom:20px; overflow:hidden; }
.stat-block { flex:1; text-align:center; padding:16px 20px; }
.stat-block + .stat-block { border-left:1px solid var(--border); }
.stat-num { font-family:'Instrument Serif',serif; font-size:30px; color:var(--text); line-height:1; }
.stat-lbl { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-top:4px; }
.stat-arrow { display:flex; align-items:center; padding:0 8px; font-size:16px; color:var(--dim); flex-shrink:0; }

/* SEARCH */
.search-wrap { margin-bottom:16px; }
.search-input { width:100%; max-width:420px; background:var(--bg3); border:1px solid var(--border-s); border-radius:8px; padding:10px 14px; font-family:'Outfit',sans-serif; font-size:13px; color:var(--text); outline:none; transition:border-color .2s; }
.search-input:focus { border-color:var(--accent); }
.search-input::placeholder { color:var(--dim); }

/* CARDS */
.app-card { background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:14px 20px; margin-bottom:8px; display:flex; align-items:center; gap:12px; transition:border-color .15s; }
.app-card:hover { border-color:var(--border-s); }
.app-left { flex:1; min-width:0; }
.app-company { font-family:'Instrument Serif',serif; font-size:16px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.app-role { font-size:12px; color:var(--mid); margin-top:2px; font-weight:300; }
.app-date { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); margin-top:3px; }
.app-meta { display:flex; align-items:center; gap:7px; flex-shrink:0; }
.app-score { font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 9px; border-radius:4px; }
.app-score.high { background:var(--go-bg); color:var(--go); }
.app-score.mid  { background:var(--warn-bg); color:var(--warn); }
.app-score.low  { background:var(--bg2); color:var(--dim); }
.status-pill { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.07em; text-transform:uppercase; padding:3px 9px; border-radius:4px; cursor:pointer; user-select:none; transition:opacity .15s; }
.status-pill:hover { opacity:.72; }
.status-pill.applied  { background:var(--bg2); color:var(--dim); }
.status-pill.interview { background:rgba(83,74,183,.1); color:var(--accent); border:1px solid rgba(83,74,183,.2); }
.status-pill.offer    { background:var(--go-bg); color:var(--go); border:1px solid var(--go-border); }
.status-pill.rejected { background:var(--no-bg); color:var(--no); }
.app-actions { display:flex; gap:6px; flex-shrink:0; }
.app-btn { font-size:11px; padding:5px 12px; border:1px solid var(--border-s); border-radius:6px; background:var(--bg3); color:var(--mid); cursor:pointer; font-family:'Outfit',sans-serif; font-weight:600; transition:all .15s; white-space:nowrap; }
.app-btn:hover { border-color:var(--accent); color:var(--accent); }
.app-btn.del { color:var(--no); }
.app-btn.del:hover { border-color:var(--no); background:var(--no-bg); }

.empty-state { text-align:center; padding:60px 20px; }
.empty-t { font-size:14px; color:var(--dim); margin-bottom:8px; font-weight:300; }
.empty-link { font-size:13px; color:var(--accent); text-decoration:none; font-weight:600; }

/* PANEL */
.panel-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.2); z-index:199; display:none; }
.panel-overlay.show { display:block; }
.detail-panel { position:fixed; top:0; right:-100%; width:62%; max-width:820px; height:100vh; background:var(--bg); border-left:1px solid var(--border-s); transition:right .3s ease; z-index:200; display:flex; flex-direction:column; }
.detail-panel.open { right:0; }
.panel-header { padding:18px 28px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.panel-company { font-family:'Instrument Serif',serif; font-size:20px; color:var(--text); }
.panel-role { font-size:12px; color:var(--mid); margin-top:2px; font-weight:300; }
.panel-close { font-size:20px; color:var(--dim); cursor:pointer; padding:4px 8px; border-radius:4px; background:none; border:none; line-height:1; }
.panel-close:hover { background:var(--bg2); color:var(--text); }
.panel-actions { padding:12px 28px; border-bottom:1px solid var(--border); display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0; }
.panel-btn { padding:7px 14px; border-radius:7px; border:1px solid var(--border-s); background:var(--bg3); font-family:'Outfit',sans-serif; font-size:12px; font-weight:600; color:var(--mid); cursor:pointer; transition:all .15s; white-space:nowrap; }
.panel-btn:hover { background:var(--bg2); }
.panel-btn.primary { background:var(--text); color:var(--bg); border-color:var(--text); }
.panel-btn.primary:hover { opacity:.85; }
.panel-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.panel-body { padding:28px; flex:1; overflow-y:auto; }

/* CV IN PANEL */
.cv-preview { background:#fff; border:1px solid var(--border-s); border-radius:10px; padding:32px 36px; font-family:'Outfit',sans-serif; }
.cv-name { font-family:'Instrument Serif',serif; font-size:22px; color:var(--text); }
.cv-meta { font-size:11px; color:var(--mid); margin-top:6px; margin-bottom:8px; line-height:1.8; }
.cv-divider { border:none; border-top:1px solid var(--border); margin:14px 0 10px; }
.cv-sec-lbl { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:8px; }
.cv-role-header { display:flex; justify-content:space-between; align-items:baseline; }
.cv-role-title { font-size:13px; font-weight:600; color:var(--text); }
.cv-role-company { font-size:11px; color:var(--mid); margin-left:6px; font-weight:300; }
.cv-role-period { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); }
.cv-bullets { margin:5px 0 0 0; padding-left:14px; }
.cv-bullets li { font-size:12px; color:var(--mid); line-height:1.6; margin-bottom:2px; font-weight:300; }
.cv-role-block { margin-bottom:14px; break-inside:avoid; page-break-inside:avoid; }
.cv-section-wrap { position:relative; margin-bottom:4px; }
.cv-section-wrap:hover .edit-btn { opacity:1; }
.edit-btn { position:absolute; top:0; right:0; opacity:0; font-size:10px; padding:3px 8px; border:1px solid var(--border-s); border-radius:4px; background:var(--bg2); color:var(--dim); cursor:pointer; font-family:'Outfit',sans-serif; font-weight:600; transition:opacity .15s; z-index:2; }
.edit-btn:hover { border-color:var(--accent); color:var(--accent); }
[contenteditable="true"] { outline:2px solid var(--accent); border-radius:3px; }

/* PREP VIEW */
.prep-q { margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--border); }
.prep-q:last-child { border-bottom:none; margin-bottom:0; }
.prep-type { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); background:var(--bg2); padding:2px 7px; border-radius:4px; display:inline-block; margin-bottom:8px; }
.prep-question { font-size:13px; font-weight:600; color:var(--text); margin-bottom:10px; line-height:1.5; }
.prep-answer { font-size:12px; color:var(--mid); line-height:1.8; font-weight:300; margin-bottom:8px; }
.prep-tip { font-size:11px; color:var(--accent); background:rgba(83,74,183,.06); border:1px solid rgba(83,74,183,.15); border-radius:6px; padding:7px 11px; }
.prep-cq { font-size:12px; color:var(--mid); font-weight:300; line-height:1.7; margin-bottom:8px; padding-left:12px; border-left:2px solid var(--accent); }

@keyframes spin { to { transform:rotate(360deg); } }
.spinner { width:28px; height:28px; border:2px solid var(--border-s); border-top-color:var(--accent); border-radius:50%; animation:spin .75s linear infinite; }

/* PRINT */
@page { size:A4; margin:14mm; }
@media print {
  .os-nav,.panel-header,.panel-actions,.search-wrap,.analytics-bar,.app-card,.empty-state,.edit-btn,.panel-overlay { display:none !important; }
  .detail-panel { position:static; width:100%; height:auto; border:none; }
  .cv-preview { border:none; border-radius:0; padding:0; }
  .cv-role-block { break-inside:avoid; page-break-inside:avoid; }
  body { background:white !important; }
}
</style>
</head>
<body>

<nav class="os-nav">
  <a href="JobSearchOS-Setup.html" class="nav-logo">Job Search <em>OS</em></a>
  <div class="nav-links">
    <a href="JobSearchOS-Setup.html" class="nav-link" data-page="setup">Setup</a>
    <a href="Agent1-JD-Screener.html" class="nav-link" data-page="agent1">01 · JD Screener</a>
    <a href="Agent4A-CV-Tailorer.html" class="nav-link" data-page="agent4a">02 · CV Tailor</a>
    <a href="Agent6-History.html" class="nav-link" data-page="agent6">03 · Tracker</a>
  </div>
  <div class="nav-context" id="navContext"></div>
</nav>

<div class="header">
  <div>
    <div class="tag">Job Search OS · Step 03 of 03</div>
    <div class="title">Application <em>Tracker</em></div>
    <div class="sub">Your job search command centre. Every application, all in one place.</div>
  </div>
  <a href="Agent1-JD-Screener.html" style="display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--text);color:var(--bg);border-radius:8px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;text-decoration:none;flex-shrink:0;transition:opacity .15s;" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">+ New application</a>
</div>

<div class="main">
  <div class="analytics-bar">
    <div class="stat-block">
      <div class="stat-num" id="statApplied">0</div>
      <div class="stat-lbl">Applied</div>
    </div>
    <div class="stat-arrow">→</div>
    <div class="stat-block">
      <div class="stat-num" id="statInterviews">0</div>
      <div class="stat-lbl">Interviews</div>
    </div>
    <div class="stat-arrow">→</div>
    <div class="stat-block">
      <div class="stat-num" id="statOffers">0</div>
      <div class="stat-lbl">Offers</div>
    </div>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" placeholder="Search by company or role…" oninput="renderList()" />
  </div>
  <div id="appList"></div>
</div>

<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="panel-header">
    <div>
      <div class="panel-company" id="panelCompany"></div>
      <div class="panel-role" id="panelRole"></div>
    </div>
    <button class="panel-close" onclick="closePanel()">×</button>
  </div>
  <div class="panel-actions">
    <button class="panel-btn primary" onclick="downloadCV()">Download CV</button>
    <button class="panel-btn" id="downloadCLBtn" onclick="downloadCoverLetter()" style="display:none">Download Cover Letter</button>
    <button class="panel-btn" id="viewJDBtn" onclick="toggleView('jd')">View JD</button>
    <button class="panel-btn" id="prepBtn" onclick="toggleView('prep')">Prep for Interview</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
const LINKEDIN_URL = 'https://www.linkedin.com/in/pakshiraj/';
const STATUS_CYCLE = ['applied','interview','offer','rejected'];
const STATUS_LABEL = { applied:'Applied', interview:'Interview Scheduled', offer:'Offer', rejected:'Rejected' };

function initNav(activePage) {
  document.querySelectorAll('.nav-link').forEach(l => {
    if (l.dataset.page === activePage) l.classList.add('active');
  });
  const ctx = localStorage.getItem('pakshi_current_company');
  const role = localStorage.getItem('pakshi_current_role');
  if (ctx && role) {
    const el = document.getElementById('navContext');
    if (el) { el.textContent = ctx + ' · ' + role; el.classList.add('show'); }
  }
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('pakshi_history') || '[]'); } catch(e) { return []; }
}

function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
  catch(e) { return iso; }
}

function scoreClass(s) {
  const n = parseInt(s);
  if (n >= 8) return 'high';
  if (n >= 6) return 'mid';
  return 'low';
}

function renderAnalytics() {
  const h = getHistory();
  document.getElementById('statApplied').textContent = h.length;
  document.getElementById('statInterviews').textContent = h.filter(e => e.status === 'interview' || e.status === 'offer').length;
  document.getElementById('statOffers').textContent = h.filter(e => e.status === 'offer').length;
}

function cycleStatus(id, event) {
  event.stopPropagation();
  const history = getHistory();
  const idx = history.findIndex(e => e.id === id);
  if (idx === -1) return;
  const cur = history[idx].status || 'applied';
  history[idx].status = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur) + 1) % STATUS_CYCLE.length];
  localStorage.setItem('pakshi_history', JSON.stringify(history));
  if (currentEntry && currentEntry.id === id) currentEntry = history[idx];
  renderList();
  renderAnalytics();
}

function renderList() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const history = getHistory();
  const filtered = q ? history.filter(e => (e.company+' '+e.role).toLowerCase().includes(q)) : history;
  const el = document.getElementById('appList');
  if (!filtered.length) {
    el.innerHTML = history.length
      ? `<div class="empty-state"><div class="empty-t">No results for "${q}".</div></div>`
      : `<div class="empty-state"><div class="empty-t">No applications yet.</div><div style="margin-top:8px"><a class="empty-link" href="Agent1-JD-Screener.html">Screen a role to get started →</a></div></div>`;
    return;
  }
  el.innerHTML = filtered.map(e => {
    const status = e.status || 'applied';
    return `<div class="app-card">
      <div class="app-left">
        <div class="app-company">${e.company}</div>
        <div class="app-role">${e.role}</div>
        <div class="app-date">${formatDate(e.date)}</div>
      </div>
      <div class="app-meta">
        ${e.score ? `<div class="app-score ${scoreClass(e.score)}">${e.score}/10</div>` : ''}
        <div class="status-pill ${status}" onclick="cycleStatus('${e.id}',event)" title="Click to update status">${STATUS_LABEL[status]||'Applied'}</div>
      </div>
      <div class="app-actions">
        <button class="app-btn" onclick="openPanel('${e.id}')">View Details</button>
        <button class="app-btn del" onclick="deleteEntry('${e.id}')">×</button>
      </div>
    </div>`;
  }).join('');
}

let currentEntry = null;
let currentView = 'cv';

function openPanel(id) {
  const history = getHistory();
  const entry = history.find(e => e.id === id);
  if (!entry) return;
  currentEntry = entry;
  currentView = 'cv';
  document.getElementById('panelCompany').textContent = entry.company;
  document.getElementById('panelRole').textContent = entry.role;
  document.getElementById('downloadCLBtn').style.display = entry.coverLetter ? '' : 'none';
  syncPanelBtns();
  renderPanelBody();
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function toggleView(view) {
  currentView = currentView === view ? 'cv' : view;
  syncPanelBtns();
  renderPanelBody();
}

function syncPanelBtns() {
  document.getElementById('viewJDBtn').classList.toggle('active', currentView === 'jd');
  document.getElementById('prepBtn').classList.toggle('active', currentView === 'prep');
}

function renderPanelBody() {
  if (!currentEntry) return;
  const body = document.getElementById('panelBody');
  if (currentView === 'jd') {
    const jd = (currentEntry.jdText || 'No job description saved.').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    body.innerHTML = `<div class="tag" style="margin-bottom:10px">Job Description</div>
      <textarea style="width:100%;min-height:420px;background:var(--bg3);border:1px solid var(--border-s);border-radius:8px;padding:14px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:300;color:var(--text);line-height:1.7;resize:vertical;outline:none;" readonly>${jd}</textarea>`;
  } else if (currentView === 'prep') {
    renderPrepView();
  } else {
    let cv; try { cv = JSON.parse(currentEntry.cvJson); } catch(e) { cv = null; }
    body.innerHTML = cv ? renderCVHTML(cv) : `<div style="color:var(--dim);font-size:13px">CV data could not be loaded.</div>`;
  }
}

async function renderPrepView() {
  const body = document.getElementById('panelBody');

  // Use cached prep if available
  if (currentEntry.prepData) {
    try { body.innerHTML = renderPrepHTML(JSON.parse(currentEntry.prepData)); return; } catch(e) {}
  }

  body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:14px;">
    <div class="spinner"></div>
    <div style="font-size:13px;color:var(--mid)">Generating interview prep…</div>
    <div style="font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace;text-align:center;">Reading JD · Matching your experience · Building Q&amp;A</div>
  </div>`;

  const key = localStorage.getItem('pakshi_api_key') || '';
  if (!key) {
    body.innerHTML = `<div style="color:var(--no);font-size:13px;padding:20px">No API key. <a href="JobSearchOS-Setup.html" style="color:var(--no);font-weight:600">Go to Setup →</a></div>`;
    return;
  }

  const name = localStorage.getItem('pakshi_profile_name') || 'Candidate';
  const SYS = `You are an interview prep coach for ${name}'s Job Search OS.

JD:
${currentEntry.jdText || ''}

CV (JSON):
${currentEntry.cvJson || '{}'}

Return ONLY valid JSON — no markdown fences:
{
  "questions": [
    {
      "question": "Question text",
      "type": "behavioral|situational|competency|motivational",
      "answer": "Tailored STAR answer using the candidate's actual CV experience only. Situation/task brief, action specific, result with metric.",
      "tip": "One short delivery coaching note"
    }
  ],
  "candidate_questions": [
    "Specific question to ask interviewer — grounded in the JD, not generic"
  ]
}

Rules:
1. 6–8 questions: why this role, core competency, biggest achievement, challenge handled, leadership/team, role-specific.
2. Answers use only actual CV experience — never invent examples.
3. Exactly 3 candidate questions, each referencing something specific in the JD.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:4000, system:SYS, messages:[{ role:'user', content:`Generate interview prep for: ${currentEntry.role} at ${currentEntry.company}` }] })
    });
    if (!resp.ok) { const t = await resp.text(); throw new Error(`API ${resp.status}: ${t.slice(0,120)}`); }
    const data = await resp.json();
    const raw = data.content.filter(b => b.type==='text').map(b => b.text).join('');
    const prep = JSON.parse(raw.replace(/```json|```/g,'').trim());

    const history = getHistory();
    const idx = history.findIndex(e => e.id === currentEntry.id);
    if (idx !== -1) {
      history[idx].prepData = JSON.stringify(prep);
      localStorage.setItem('pakshi_history', JSON.stringify(history));
      currentEntry = history[idx];
    }
    body.innerHTML = renderPrepHTML(prep);
  } catch(e) {
    body.innerHTML = `<div style="color:var(--no);font-size:13px;padding:20px"><strong>Failed:</strong> ${e.message}<br><br>Check your API key has credits.</div>`;
  }
}

function renderPrepHTML(prep) {
  const qHTML = (prep.questions||[]).map((q,i) => `
    <div class="prep-q">
      <div class="prep-type">${q.type||'behavioral'}</div>
      <div class="prep-question">Q${i+1}. ${q.question}</div>
      <div class="prep-answer">${q.answer}</div>
      ${q.tip ? `<div class="prep-tip"><strong>Tip:</strong> ${q.tip}</div>` : ''}
    </div>`).join('');
  const cqHTML = (prep.candidate_questions||[]).map(q => `<div class="prep-cq">${q}</div>`).join('');
  return `
    <div class="tag" style="margin-bottom:16px">Interview Prep · ${currentEntry.company}</div>
    ${qHTML}
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:24px 0 12px;">Questions to ask them</div>
    ${cqHTML}
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
      <button class="panel-btn" onclick="regeneratePrep()">Regenerate prep</button>
    </div>`;
}

function regeneratePrep() {
  const history = getHistory();
  const idx = history.findIndex(e => e.id === currentEntry.id);
  if (idx !== -1) { delete history[idx].prepData; localStorage.setItem('pakshi_history', JSON.stringify(history)); currentEntry = history[idx]; }
  renderPrepView();
}

function renderCVHTML(cv) {
  const expHTML = (cv.experience||[]).map(role => `
    <div class="cv-role-block">
      <div class="cv-role-header">
        <div><span class="cv-role-title">${role.title}</span><span class="cv-role-company"> · ${role.company}</span></div>
        <span class="cv-role-period">${role.period}</span>
      </div>
      <ul class="cv-bullets">${(role.bullets||[]).map(b=>`<li>${b}</li>`).join('')}</ul>
    </div>`).join('');
  const lead = (cv.skills?.lead||[]).join('  ·  ');
  const other = (cv.skills?.other||[]).join('  ·  ');
  const eduHTML = (cv.education||[]).map(e=>`<div style="font-size:12px;color:var(--mid);font-weight:300;margin-bottom:3px">${e.degree} · ${e.school} · ${e.year}</div>`).join('');
  const contactLine = [cv.location, cv.phone, cv.email].filter(Boolean).join('  ·  ');
  const linkedin = cv.linkedin || LINKEDIN_URL;

  return `<div class="cv-preview" id="cvPreviewPanel">
    <div class="cv-name">${cv.name||''}</div>
    <div class="cv-meta">${contactLine}${linkedin ? `  ·  <a href="${linkedin}" style="color:var(--accent);text-decoration:none" target="_blank">LinkedIn</a>` : ''}</div>
    <hr class="cv-divider">
    <div class="cv-sec-lbl">Professional Summary</div>
    <div class="cv-section-wrap">
      <button class="edit-btn" onclick="toggleEdit(this)">✎ Edit</button>
      <div class="cv-editable" style="font-size:12px;color:var(--mid);font-weight:300;line-height:1.7">${cv.summary||''}</div>
    </div>
    <hr class="cv-divider">
    <div class="cv-sec-lbl">Experience</div>
    ${expHTML}
    <hr class="cv-divider">
    <div class="cv-sec-lbl">Skills</div>
    <div class="cv-section-wrap">
      <button class="edit-btn" onclick="toggleEdit(this)">✎ Edit</button>
      <div class="cv-editable">
        ${lead ? `<div style="font-size:9px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px">Core</div><div style="font-size:12px;color:var(--mid);font-weight:300;line-height:1.7;margin-bottom:8px">${lead}</div>` : ''}
        ${other ? `<div style="font-size:9px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px">Additional</div><div style="font-size:12px;color:var(--mid);font-weight:300;line-height:1.7">${other}</div>` : ''}
      </div>
    </div>
    <hr class="cv-divider">
    <div class="cv-sec-lbl">Education</div>
    <div class="cv-section-wrap">
      <button class="edit-btn" onclick="toggleEdit(this)">✎ Edit</button>
      <div class="cv-editable">${eduHTML}</div>
    </div>
  </div>`;
}

function toggleEdit(btn) {
  const content = btn.closest('.cv-section-wrap').querySelector('.cv-editable');
  const editing = content.contentEditable === 'true';
  content.contentEditable = editing ? 'false' : 'true';
  btn.textContent = editing ? '✎ Edit' : '✓ Done';
  if (!editing) content.focus();
}

function closePanel() {
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  currentEntry = null; currentView = 'cv';
}

async function downloadCV() {
  if (!currentEntry) return;
  const prevView = currentView;
  if (currentView !== 'cv') { currentView = 'cv'; syncPanelBtns(); renderPanelBody(); }
  await new Promise(r => setTimeout(r, 80));
  const el = document.getElementById('cvPreviewPanel');
  if (!el) { currentView = prevView; syncPanelBtns(); renderPanelBody(); return; }
  const orig = el.style.cssText;
  el.style.cssText = 'border:none!important;border-radius:0!important;box-shadow:none!important;padding:0!important;background:#fff!important;';
  const pName = (localStorage.getItem('pakshi_profile_name')||'Candidate').replace(/\s+/g,'');
  const co = (currentEntry.company||'Company').replace(/[^a-zA-Z0-9]/g,'');
  const dt = new Date(currentEntry.date).toISOString().split('T')[0];
  const filename = `CV_${pName}_${co}_${dt}.pdf`;
  try {
    const blob = await html2pdf().set({
      margin:[14,14,14,14], filename,
      html2canvas:{ scale:2, useCORS:true, logging:false, ignoreElements: e => e.classList && e.classList.contains('edit-btn') },
      jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak:{ mode:['avoid-all','css'] }
    }).from(el).outputPdf('blob');
    el.style.cssText = orig;
    if (prevView !== 'cv') { currentView = prevView; syncPanelBtns(); renderPanelBody(); }
    await saveBlob(blob, filename);
  } catch(e) {
    el.style.cssText = orig;
    if (prevView !== 'cv') { currentView = prevView; syncPanelBtns(); renderPanelBody(); }
    alert('PDF failed: ' + e.message);
  }
}

async function downloadCoverLetter() {
  if (!currentEntry?.coverLetter) return;
  const pName = (localStorage.getItem('pakshi_profile_name')||'Candidate').replace(/\s+/g,'');
  const co = (currentEntry.company||'Company').replace(/[^a-zA-Z0-9]/g,'');
  const dt = new Date(currentEntry.date).toISOString().split('T')[0];
  const filename = `CoverLetter_${pName}_${co}_${dt}.pdf`;
  const lines = currentEntry.coverLetter.split('\n');
  const subject = lines[0].replace('Subject: ','');
  const body = lines.slice(2).join('\n');
  const div = document.createElement('div');
  div.style.cssText = 'position:absolute;left:-9999px;top:0;width:190mm;font-family:Outfit,sans-serif;font-size:12px;line-height:1.85;color:#1a1916;background:#fff;';
  div.innerHTML = `
    <div style="margin-bottom:24px;font-size:10px;font-family:IBM Plex Mono,monospace;color:#9a9890;letter-spacing:.06em;">${pName.replace(/([A-Z])/g,' $1').trim()} · ${new Date(currentEntry.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>
    <div style="font-weight:600;margin-bottom:24px;font-size:12px;">${subject}</div>
    <div style="white-space:pre-line;font-weight:300;color:#5a5850;">${body}</div>`;
  document.body.appendChild(div);
  try {
    const blob = await html2pdf().set({
      margin:[20,20,20,20], filename,
      html2canvas:{ scale:2, useCORS:true, logging:false },
      jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' }
    }).from(div).outputPdf('blob');
    document.body.removeChild(div);
    await saveBlob(blob, filename);
  } catch(e) {
    document.body.removeChild(div);
    alert('Cover letter PDF failed: ' + e.message);
  }
}

async function saveBlob(blob, filename) {
  if ('showSaveFilePicker' in window) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName:filename, types:[{ description:'PDF Document', accept:{'application/pdf':['.pdf']} }] });
      const w = await handle.createWritable();
      await w.write(blob); await w.close(); return;
    } catch(e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function deleteEntry(id) {
  if (!confirm('Remove this application from your tracker?')) return;
  localStorage.setItem('pakshi_history', JSON.stringify(getHistory().filter(e => e.id !== id)));
  if (currentEntry?.id === id) closePanel();
  renderList(); renderAnalytics();
}

window.addEventListener('load', () => {
  initNav('agent6');
  renderList();
  renderAnalytics();
});
</script>
</body>
</html>
